name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Buat project Android (Capacitor)
        run: |
          mkdir cap && cd cap
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install @anuradev/capacitor-background-mode || echo "Plugin latar belakang gagal dipasang, lanjut tanpa plugin"
          mkdir www
          echo '<!doctype html><html><head><meta charset="utf-8"><title>SpideyFy</title></head><body style="background:#0b0b10"></body></html>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "app.vercel.spidefy",
            "appName": "SpideyFy",
            "webDir": "www",
            "backgroundColor": "#0b0b10",
            "android": {
              "backgroundColor": "#0b0b10",
              "adjustMarginsForEdgeToEdge": "force"
            },
            "server": {
              "url": "https://spidefy.vercel.app",
              "androidScheme": "https"
            }
          }
          JSON
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          # Layar penuh tapi tidak menimpa status bar / tombol navigasi: latar gelap + ikon status terang
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowBackground">\#0b0b10</item>\n        <item name="android:windowLightStatusBar">false</item>#' "$STYLES"

      - name: Pasang ikon aplikasi
        run: |
          cd cap/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "$GITHUB_WORKSPACE/public/icon-512.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/public/icon-round-512.png" "$d/ic_launcher_round.png"
            cp "$GITHUB_WORKSPACE/public/icon-512.png" "$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SpideyFy APK ${{ github.run_number }}
          files: cap/android/app/build/outputs/apk/debug/app-debug.apk
