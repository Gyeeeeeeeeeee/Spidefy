name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # >>> GANTI baris ini dengan link Vercel kamu yang asli <<<
  APP_URL: https://GANTI-NAMA-PROJECT-KAMU.vercel.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cek APP_URL sudah diganti
        run: |
          echo "APP_URL = $APP_URL"
          case "$APP_URL" in
            *GANTI*|"https://vercel.app"|"") echo "::error::APP_URL belum diisi link Vercel yang asli (lihat baris env di atas file ini)"; exit 1 ;;
          esac

      - name: Buat project Android (Capacitor)
        run: |
          mkdir cap && cd cap
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install @anuradev/capacitor-background-mode --legacy-peer-deps || echo "::warning::Plugin latar belakang GAGAL dipasang"
          npm install @jofr/capacitor-media-session --legacy-peer-deps || echo "::warning::Plugin kontrol media GAGAL dipasang"
          mkdir www
          echo '<!doctype html><html><head><meta charset="utf-8"><title>SpideyFy</title></head><body style="background:#0b0b10"></body></html>' > www/index.html
          cat > capacitor.config.json <<JSON
          {
            "appId": "app.vercel.spidefy",
            "appName": "SpideyFy",
            "webDir": "www",
            "backgroundColor": "#0b0b10",
            "android": {
              "backgroundColor": "#0b0b10",
              "adjustMarginsForEdgeToEdge": "force"
            },
            "server": {
              "url": "$APP_URL",
              "androidScheme": "https"
            }
          }
          JSON
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          # Layar penuh tapi tidak menimpa status bar / tombol navigasi: latar gelap + ikon status terang
          STYLES=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowBackground">\#0b0b10</item>\n        <item name="android:windowLightStatusBar">false</item>#' "$STYLES"

          # Jaga WebView & CPU tetap hidup saat app ke latar belakang / layar mati (supaya musik tidak dijeda)
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          if [ -n "$MA" ]; then
          PKG=$(grep -m1 '^package ' "$MA" | sed 's/package \(.*\);/\1/')
          cat > "$MA" <<JAVA
          package $PKG;

          import android.content.Context;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.view.View;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            private PowerManager.WakeLock wakeLock;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              // Android 13+: izin notifikasi harus diminta, kalau tidak widget pemutar tidak muncul
              if (android.os.Build.VERSION.SDK_INT >= 33
                  && checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)
                      != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[] { android.Manifest.permission.POST_NOTIFICATIONS }, 1001);
              }

              try {
                PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                if (pm != null) {
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "SpideyFy::AudioWakeLock");
                  wakeLock.acquire();
                }
              } catch (Exception e) {
                // abaikan
              }

              // Paksa WebView selalu mengira dirinya VISIBLE meski Activity masuk background
              try {
                final WebView w = getBridge().getWebView();
                if (w != null) {
                  w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  w.addOnLayoutChangeListener(new View.OnLayoutChangeListener() {
                    @Override
                    public void onLayoutChange(View v, int l, int t, int r, int b, int ol, int ot, int or, int ob) {
                      if (v.getWindowVisibility() != View.VISIBLE) {
                        v.dispatchWindowVisibilityChanged(View.VISIBLE);
                      }
                    }
                  });
                }
              } catch (Exception e) {
                // abaikan
              }
            }

            private void keepAwake() {
              try {
                if (getBridge() == null) return;
                WebView w = getBridge().getWebView();
                if (w == null) return;
                w.getSettings().setMediaPlaybackRequiresUserGesture(false);
                w.onResume();
                w.resumeTimers();
                w.dispatchWindowVisibilityChanged(View.VISIBLE);
              } catch (Exception e) {
                // abaikan
              }
            }

            private void keepAwakeRepeatedly() {
              keepAwake();
              try {
                final WebView w = getBridge().getWebView();
                for (int i = 1; i <= 10; i++) {
                  w.postDelayed(new Runnable() {
                    @Override
                    public void run() { keepAwake(); }
                  }, i * 500L);
                }
              } catch (Exception e) {
                // abaikan
              }
            }

            @Override
            public void onPause() {
              super.onPause();
              keepAwakeRepeatedly();
            }

            @Override
            public void onStop() {
              super.onStop();
              keepAwakeRepeatedly();
            }

            @Override
            public void onDestroy() {
              try {
                if (wakeLock != null && wakeLock.isHeld()) {
                  wakeLock.release();
                }
              } catch (Exception e) {
                // abaikan
              }
              super.onDestroy();
            }
          }
          JAVA
          fi
          echo "=== Manifest plugin latar belakang (untuk cek) ==="
          cat node_modules/@anuradev/capacitor-background-mode/android/src/main/AndroidManifest.xml || echo "plugin tidak ditemukan"

      - name: Pastikan service media bertipe mediaPlayback
        run: |
          cd cap
          for f in node_modules/@jofr/capacitor-media-session/android/src/main/AndroidManifest.xml node_modules/@anuradev/capacitor-background-mode/android/src/main/AndroidManifest.xml; do
            if [ -f "$f" ] && grep -q "<service" "$f" && ! grep -q "foregroundServiceType" "$f"; then
              sed -i 's#<service#<service android:foregroundServiceType="mediaPlayback"#' "$f"
              echo "Diperbaiki: $f"
            fi
          done
          echo "=== Manifest plugin media (untuk cek) ==="
          cat node_modules/@jofr/capacitor-media-session/android/src/main/AndroidManifest.xml || echo "plugin media tidak ditemukan"

      - name: Pasang ikon aplikasi
        run: |
          cd cap/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            cp "$GITHUB_WORKSPACE/public/icon-512.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/public/icon-round-512.png" "$d/ic_launcher_round.png"
            cp "$GITHUB_WORKSPACE/public/icon-512.png" "$d/ic_launcher_foreground.png"
          done

      - name: Build APK
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rilis APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SpideyFy APK ${{ github.run_number }}
          files: cap/android/app/build/outputs/apk/debug/app-debug.apk
          
